[package]
name = "tohru-voice-native"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"
publish = false

[dependencies]
anyhow = "=1.0.100"
thiserror = "=2.0.20"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.151"
clap = { version = "=4.5.60", features = ["derive"] }
regex = "=1.12.3"
ort = { version = "=2.0.0-rc.10", default-features = false, features = ["std", "load-dynamic"] }
sherpa-onnx = { version = "=2.0.3", default-features = false }
misaki-rs = { version = "=0.11.0", default-features = false }
rustfft = "=6.4.1"
signal-hook = "=0.3.18"
hound = "=3.5.1"
rustix = { version = "=1.1.4", features = ["fs", "time"] }
libloading = "=0.8.9"

[lints.rust]
unsafe_code = "deny"
unreachable_pub = "warn"

[lints.clippy]
undocumented_unsafe_blocks = "warn"
