[package]
name = "tohru-scene-tests"
version = "0.0.0"
edition = "2024"
publish = false

[dev-dependencies]
mlua = { version = "0.12", features = ["luau", "send"] }
naga = { version = "30", features = ["wgsl-in"] }
tohru-shell = { path = "../../runtime" }

[[test]]
name = "osd"
path = "../osd/logic.rs"

[[test]]
name = "sound"
path = "../sound/logic.rs"

[[test]]
name = "settings-ui"
path = "../settings-ui/logic.rs"

[[test]]
name = "workspace-shader"
path = "../bar/workspace-shader.rs"

[[test]]
name = "water-shader"
path = "../water-shader.rs"

[[test]]
name = "notifications-bevel-shader"
path = "../session/bevel-shader.rs"

[[test]]
name = "launcher-deck"
path = "../launcher/deck.rs"

[[test]]
name = "media-lens-shader"
path = "../media/lens-shader.rs"

[[test]]
name = "lock-shaders"
path = "../lock/shaders.rs"

[[test]]
name = "lock-logic"
path = "../lock/logic.rs"

[[test]]
name = "greeter-logic"
path = "../greeter/logic.rs"

[[test]]
name = "wallpaper-shaders"
path = "../wallpaper/shaders.rs"

[[test]]
name = "polkit"
path = "../polkit/logic.rs"

[[test]]
name = "water-vessel-shader"
path = "../polkit/vessel-shader.rs"
