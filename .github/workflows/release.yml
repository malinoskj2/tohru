name: Release

on:
  push:
    tags: ["v*"]

permissions: {}

jobs:
  build:
    uses: ./.github/workflows/runtime.yml
    permissions:
      contents: read
    with:
      cache: false

  publish:
    name: Attest and publish
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tohru-x86_64-linux
          path: dist

      - name: Write checksums
        working-directory: dist
        run: sha256sum tohru-x86_64-linux.tar.gz > SHA256SUMS

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/tohru-x86_64-linux.tar.gz
            dist/SHA256SUMS

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" --verify-tag --title "Tohru $TAG" --generate-notes \
            dist/tohru-x86_64-linux.tar.gz dist/SHA256SUMS
