name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: "1.90.0"

jobs:
  checks:
    name: Format, unit and logic tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Lua and PyGObject
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends lua5.4 python3-gi

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: |
            runtime
            tests/rust

      - name: cargo fmt --check
        run: |
          cargo fmt --check --manifest-path runtime/Cargo.toml
          cargo fmt --check --manifest-path tests/rust/Cargo.toml

      - name: Test tohru-shell
        run: cargo test --locked --manifest-path runtime/Cargo.toml

      - name: Test the scene logic from Rust
        run: cargo test --locked --manifest-path tests/rust/Cargo.toml

      - name: Lua logic tests
        run: |
          status=0
          for test in $(find tests -name '*.lua' | sort); do
            echo "lua5.4 $test"
            lua5.4 "$test" || status=1
          done
          exit "$status"

      - name: Python CPU tests
        run: |
          status=0
          while read -r -a test; do
            echo "python3 ${test[*]}"
            python3 -B "${test[@]}" || status=1
          done <<'EOF'
          tests/cli.py
          tests/isolation.py
          tests/packaging-locks.py
          tests/role-launch.py
          tests/bar/cleanup.py
          tests/bar/isolation.py
          tests/connectivity/protocol.py
          tests/connectivity/secret.py
          tests/launcher/lifecycle.py --cpu
          tests/network/strength.py
          tests/session/test_isolation.py
          tests/settings-ui/contrast.py
          EOF
          exit "$status"

  runtime:
    uses: ./.github/workflows/runtime.yml
    permissions:
      contents: read

  nix:
    name: Nix build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31.11.5

      - uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7.0.2
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.lock', '**/*.nix') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-

      - name: Evaluate the flake
        run: nix flake check --no-build

      - name: Build the flake packages
        run: nix build --print-build-logs .#tohru .#pleamar-runtime .#tohru-hyprland
